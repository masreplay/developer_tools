  package_info_plus: ^10.2.2
  open_filex: ^4.6.0
  sensors_plus: ^7.1.1
  share_plus: ^13.3.1
  collection: ^1.19.1
  url_launcher: ^6.3.2
  equatable: ^2.0.8
  dio: ^5.7.0

  material_ui: ^1.6.0
  cupertino_ui: ^1.1.2
  archive: ^4.5.2
dev_dependencies:
  flutter_test:
    sdk: flutter
